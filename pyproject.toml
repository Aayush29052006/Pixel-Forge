[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "0.1.0"
description = "Batch image format conversion, resizing, and rotation — web app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=11.3",  # 11.3+ reads and writes AVIF natively
    "pillow-heif>=0.18",  # HEIC/HEIF (iPhone photos)
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
